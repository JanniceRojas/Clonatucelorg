<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clonatucel</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ff66;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .pantalla {
      padding: 30px;
      max-width: 600px;
    }
    .mensaje {
      font-size: 28px;
      font-weight: bold;
      margin-top: 30px;
      line-height: 1.4;
    }
    .cursor {
      display: inline-block;
      animation: parpadeo 0.8s infinite;
    }
    @keyframes parpadeo {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="pantalla">
    <div id="texto">Conectando...</div>
    <div class="mensaje" id="mensaje"></div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("texto").textContent = "Acceso concedido.";
    }, 1500);

    setTimeout(() => {
      document.getElementById("mensaje").innerHTML =
        "¿A QUÉ LE TIENES MIEDO, SEBASTIÁN? 👀<span class='cursor'>_</span>";
    }, 2500);
  </script>
</body>
</html>
